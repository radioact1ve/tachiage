# Dev tools and language runtimes, identical on every machine.
# Add with `mise use -g <tool>@<version>` or edit here, then run `./bootstrap.sh mise`.
[tools]
neovim = "latest"
node = "lts"
pi = "latest"
ast-grep = "latest"
bat = "latest"
bottom = "latest"
delta = "latest"
dust = "latest"
eza = "latest"
lazygit = "latest"
go = "latest"
rust = { version = "latest", components = "rust-analyzer" }
terraform = "latest"
yq = "latest"
zoxide = "latest"
"aqua:dalance/procs" = "latest"
"github:MilesCranmer/rip2" = "latest"
